<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veganicious</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #faf9ff;
        }

        /* Header */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 6%;
        }

        .header a {
            text-decoration: none;
            color: #302b2b;
        }

        .header .logo {
            font-size: 25px;
            font-weight: bold;
            color: #17bebb;
            font-family: 'Trebuchet MS', sans-serif;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-right a {
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 4px;
            transition: 0.3s;
        }

        .header-right a:hover {
            background-color: #e9e5ed;
        }

        .header-right a.active {
            color: #17bebb;
            font-weight: bold;
        }

        .profile-img {
            width: 29px;
            height: 29px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        /* Hero Section */

        .hero {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0px 8%;
            gap: 60px;
            overflow: hidden;
        }

        /* Left Content */

        .left-content {
            position: relative;
            width: 45%;
            padding-left: 35px;
            z-index: 1;
        }

        .left-content h1 {
            position: relative;
            z-index: 2;
            font-family: 'Playfair Display', serif;
            font-size: clamp(38px, 4.5vw, 52px);
            line-height: 1.22;
            color: #302b2b;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .purple-circle {
            position: absolute;
            width: 150px;
            height: 150px;
            background-color: #c19acb;
            border-radius: 50%;
            top: -48px;
            left: -12px;
            z-index: 0;
        }

        .pink-circle {
            position: absolute;
            width: 76px;
            height: 76px;
            background-color: #fbd8d6;
            border-radius: 50%;
            top: 48px;
            left: -35px;
            z-index: 3;
        }

        .left-content h2 {
            font-family: 'Permanent Marker', cursive;
            color: #d94532;
            font-size: 27px;
            transform: rotate(-8deg);
            text-align: right;
            margin-top: -3px;
            white-space: nowrap;
        }

        .left-content p {
            color: #373238;
            font-size: 13px;
            line-height: 1.9;
        }

        .explore-btn {
            display: inline-block;
            width: 146px;
            padding: 8px 15px;
            text-align: center;
            text-decoration: none;
            color: #00bdbd;
            border: 2px solid #00d3d3;
            border-radius: 4px;
            font-size: 14px;
            transition: 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.10);
        }

        .explore-btn:hover {
            background-color: #00caca;
            color: white;
            transform: translateY(-3px);
        }

        /* Right Image */

        .right-content {
            position: relative;
            width: 46%;
            max-width: 500px;
            flex-shrink: 0;
            padding: 5px;
            background-color: #00bdbd;
        }

        .hero-image {
            width: 100%;
            height: 345px;
            object-fit: cover;
            display: block;
            position: relative;
            z-index: 1;
        }

        /* Purple Dots */

        .dots {
            position: absolute;
            right: -17px;
            bottom: -24px;
            display: grid;
            grid-template-columns: repeat(3, 15px);
            gap: 19px 23px;
            z-index: 2;
        }

        .dots span {
            width: 15px;
            height: 15px;
            background-color: #c19acb;
            border-radius: 50%;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.08);
        }

        /* Tablet Responsive */

        @media (max-width: 768px) {
            .header {
                padding: 15px 4%;
            }

            .header-right {
                gap: 3px;
            }

            .header-right a {
                font-size: 12px;
                padding: 7px;
            }

            .hero {
                flex-direction: column;
                justify-content: center;
                gap: 60px;
                padding: 65px 30px;
            }

            .left-content {
                width: 100%;
                max-width: 480px;
                padding-left: 15px;
            }

            .left-content h1 {
                font-size: clamp(36px, 8vw, 48px);
            }

            .purple-circle {
                width: 125px;
                height: 125px;
                top: -35px;
                left: -10px;
            }

            .pink-circle {
                width: 60px;
                height: 60px;
                left: -25px;
                top: 45px;
            }

            .left-content h2 {
                font-size: 23px;
                margin-bottom: 35px;
            }

            .right-content {
                width: 100%;
                max-width: 480px;
            }

            .hero-image {
                height: 300px;
            }
        }

        /* Mobile Responsive */

        @media (max-width: 500px) {
            .header {
                flex-direction: column;
                gap: 15px;
            }

            .header-right {
                flex-wrap: wrap;
                justify-content: center;
            }

            .header-right a {
                font-size: 11px;
                padding: 6px;
            }

            .hero {
                padding: 50px 22px;
                gap: 50px;
            }

            .left-content h1 {
                font-size: 34px;
            }

            .left-content h2 {
                font-size: 20px;
            }

            .left-content p {
                font-size: 12px;
            }

            .hero-image {
                height: 240px;
            }

            .dots {
                right: -10px;
                gap: 12px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header">

        <a href="#home" class="logo">
            Veganicious
        </a>

        <nav class="header-right">
            <a class="active" href="./aboutus.html">About us</a>
            <a href="#book">Veganicious Book</a>
            <a href="#contact">Contact</a>

            <a href="#profile">
                <img
                    src="https://i.pinimg.com/736x/00/f0/33/00f033afcc3560be8f3bf341b524ec64.jpg"
                    alt="Profile"
                    class="profile-img"
                >
            </a>
        </nav>  

    </header>

    <!-- Hero Section -->
    <section class="hero" id="home">

        <!-- Left Content -->
        <div class="left-content">

            <div class="purple-circle"></div>
            <div class="pink-circle"></div>

            <h1>
                Welcome to<br>
                Veganicious
            </h1>

            <h2>By Ali + Nico</h2>

            <p>
                Where vegan taste meets vibrant living.<br>
                And we're #1 on YouTube!
            </p>

            <a href="#book" class="explore-btn">Explore</a>

        </div>

        <!-- Right Image -->
        <div class="right-content">

            <img
                src="https://images.pexels.com/photos/4253302/pexels-photo-4253302.jpeg"
                alt="Friends cooking together"
                class="hero-image"
            >

            <div class="dots">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>

        </div>

    </section>

</body>
</html>
